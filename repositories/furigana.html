<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <div id="header"></div>
  <main>
    <section>
      <h2>furigana</h2>
      <p>
        archiveで検出できるディレクトリの日本語読みをローカルLLMで自動でつけるソフト．
        C++26を使うので新しいGCCじゃないと使えない(2026/5/31現在はgcc16.1.0が推奨)
        LLMはローカルにollamaを立ててもらわないといけない
      </p>
      <ul>
        <li>主な内容: 日本語ディレクトリ名に読み仮名を末尾に追加</li>
        <li>GitHub: <a href="https://github.com/clever-elsie/furigana" target="_blank">furigana</a></li>
      </ul>
      <h3>特徴</h3>
      <ul>
        <li>ローカルLLMを使って読み仮名を自動生成</li>
        <li>C++26をちょっとだけ使ってる．C++23は割と使ってる．</li>
      </ul>
      <h3>用途例</h3>
      <ul>
        <li>archiveで使うディレクトリの名前順を本当に名前順にする</li>
      </ul>
    </section>
  </main>
  <div id="footer"></div>
  <script src="/assets/include.js"></script>
</body>
</html>
